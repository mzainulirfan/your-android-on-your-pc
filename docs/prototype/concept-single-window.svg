<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b12"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="wallGlow" cx="0.7" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="send" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="winShadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="win">
      <rect x="520" y="150" width="400" height="650" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <circle cx="250" cy="170" r="330" fill="url(#glowB)"/>
  <circle cx="1230" cy="760" r="360" fill="url(#glowA)"/>

  <!-- header -->
  <text x="72" y="66" fill="#f4f4f5" font-size="30" font-weight="700" letter-spacing="-0.4">Diterapkan · 1 jendela (SetParent)</text>
  <text x="72" y="96" fill="#a1a1aa" font-size="14">Panel dan video di-host sebagai child di dalam satu parent — satu frame, satu bayangan, satu taskbar.</text>
  <rect x="1272" y="42" width="96" height="26" rx="13" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.4"/>
  <text x="1320" y="59" fill="#67e8f9" font-size="9.5" font-weight="700" letter-spacing="1" text-anchor="middle">DITERAPKAN</text>

  <!-- outer shadow + window -->
  <rect x="520" y="154" width="400" height="650" rx="16" fill="#000000" fill-opacity="0.5" filter="url(#winShadow)"/>
  <g clip-path="url(#win)">
    <rect x="520" y="150" width="400" height="110" fill="#0f172a"/>
    <rect x="520" y="260" width="400" height="540" fill="url(#wall)"/>
    <rect x="520" y="260" width="400" height="540" fill="url(#wallGlow)"/>
    <circle cx="590" cy="700" r="150" fill="#6366f1" fill-opacity="0.18"/>
    <circle cx="880" cy="330" r="130" fill="#a855f7" fill-opacity="0.14"/>
    <rect x="520" y="700" width="400" height="100" fill="#05070c" fill-opacity="0.35"/>

    <!-- phone status bar -->
    <text x="542" y="284" fill="#e0e7ff" fill-opacity="0.75" font-size="8">21:47</text>
    <g stroke="#e0e7ff" stroke-opacity="0.7" stroke-width="1" fill="none">
      <path d="M838 281v-4M842 281v-6M846 281v-2"/>
      <rect x="852" y="277" width="13" height="6" rx="2"/>
      <rect x="866" y="277" width="10" height="6" rx="2"/>
    </g>

    <!-- lock badge -->
    <circle cx="720" cy="334" r="17" fill="#ffffff" fill-opacity="0.1"/>
    <g stroke="#e0e7ff" stroke-width="1.4" fill="none">
      <rect x="714" y="332" width="12" height="9" rx="2"/>
      <path d="M716.5 332v-3a3.5 3.5 0 017 0v3"/>
    </g>

    <text x="720" y="416" fill="#eef2ff" font-size="54" font-weight="300" text-anchor="middle" letter-spacing="1">21:47</text>
    <text x="720" y="442" fill="#c7d2fe" fill-opacity="0.8" font-size="12" text-anchor="middle">Selasa, 28 Oktober</text>

    <g fill="#ffffff" fill-opacity="0.06" stroke="#e0e7ff" stroke-opacity="0.4">
      <circle cx="655" cy="492" r="6.5"/>
      <circle cx="681" cy="492" r="6.5"/>
      <circle cx="707" cy="492" r="6.5"/>
      <circle cx="733" cy="492" r="6.5"/>
      <circle cx="759" cy="492" r="6.5"/>
      <circle cx="785" cy="492" r="6.5"/>
    </g>
    <text x="720" y="526" fill="#c7d2fe" fill-opacity="0.55" font-size="9.5" text-anchor="middle">Masukkan PIN</text>

    <text x="562" y="756" fill="#e0e7ff" fill-opacity="0.7" font-size="10">Darurat</text>
    <g stroke="#e0e7ff" stroke-opacity="0.7" stroke-width="1.2" fill="none">
      <rect x="866" y="746" width="14" height="10" rx="2"/>
      <circle cx="873" cy="751" r="2.6"/>
    </g>

    <!-- toolbar contents (same as cap model) -->
    <g fill="#475569">
      <circle cx="538" cy="162" r="1.5"/><circle cx="544" cy="162" r="1.5"/>
      <circle cx="538" cy="168" r="1.5"/><circle cx="544" cy="168" r="1.5"/>
      <circle cx="538" cy="174" r="1.5"/><circle cx="544" cy="174" r="1.5"/>
    </g>
    <circle cx="582" cy="168" r="3.5" fill="#34d399"/>
    <circle cx="582" cy="168" r="6" fill="none" stroke="#34d399" stroke-opacity="0.25"/>
    <text x="592" y="171.5" fill="#94a3b8" font-size="9.5">scrcpy · 192.168.1.3:5555</text>

    <g fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-linecap="round">
      <circle cx="815" cy="168" r="4.6"/><path d="M815 160.5v6"/>
      <circle cx="837" cy="167" r="4.6"/><path d="M834.8 167h4.4"/><path d="M840.5 170.5l3 3"/>
      <circle cx="859" cy="167" r="4.6"/><path d="M856.8 167h4.4M859 164.8v4.4"/><path d="M862.5 170.5l3 3"/>
      <path d="M876 165.5l5 5 5-5"/>
    </g>
    <g stroke="#f87171" stroke-opacity="0.85" stroke-width="1.4" stroke-linecap="round">
      <path d="M897 164l6 6M903 164l-6 6"/>
    </g>

    <rect x="532" y="186" width="252" height="30" rx="8" fill="#090c14" stroke="#ffffff" stroke-opacity="0.1"/>
    <g stroke="#64748b" stroke-width="1.2" fill="none" stroke-linecap="round">
      <rect x="542" y="197" width="9" height="7" rx="1.6"/>
      <path d="M544 197v-2.4a2.5 2.5 0 015 0V197"/>
    </g>
    <text x="557" y="205" fill="#64748b" font-size="10.5">PIN / password</text>
    <g stroke="#64748b" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M764 199c3-4 7-4 10 0-3 4-7 4-10 0z"/>
      <circle cx="769" cy="201" r="1.7"/>
    </g>
    <rect x="792" y="186" width="116" height="30" rx="8" fill="url(#send)"/>
    <text x="850" y="205" fill="#052e16" font-size="11" font-weight="700" text-anchor="middle">Kirim</text>

    <rect x="532" y="222" width="76" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="570" y="236.5" fill="#cbd5e1" font-size="9" text-anchor="middle">PIN Utama</text>
    <rect x="616" y="222" width="84" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="658" y="236.5" fill="#cbd5e1" font-size="9" text-anchor="middle">PIN 6-Digit</text>
    <rect x="708" y="222" width="68" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="742" y="236.5" fill="#cbd5e1" font-size="9" text-anchor="middle">PIN Bank</text>
    <rect x="784" y="222" width="22" height="22" rx="11" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.25"/>
    <path d="M795 228v10M790 233h10" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round"/>

    <!-- seam is now a hairline inside one window -->
    <rect x="520" y="259" width="400" height="1" fill="#000000" fill-opacity="0.35"/>
  </g>
  <rect x="520" y="150" width="400" height="650" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>

  <!-- single-window outline -->
  <rect x="508" y="138" width="424" height="674" rx="22" fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="7 5"/>

  <!-- tag -->
  <rect x="520" y="110" width="300" height="24" rx="12" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.45"/>
  <circle cx="534" cy="122" r="3" fill="#22d3ee"/>
  <text x="544" y="125.5" fill="#67e8f9" font-size="9.5" font-weight="600" letter-spacing="0.4">SATU WINDOW · parent Tauri + child scrcpy</text>

  <!-- left card: before / after -->
  <rect x="72" y="150" width="384" height="170" rx="16" fill="#0b1220" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="92" y="176" fill="#e4e4e7" font-size="13.5" font-weight="600">Sebelum → sesudah</text>

  <rect x="100" y="190" width="140" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-opacity="0.45" stroke-dasharray="5 3"/>
  <rect x="100" y="219" width="140" height="42" rx="3" fill="url(#wall)" stroke="#22d3ee" stroke-opacity="0.45" stroke-dasharray="5 3"/>
  <rect x="100" y="216" width="140" height="3" fill="#10b981" fill-opacity="0.9"/>
  <text x="170" y="283" fill="#71717a" font-size="9.5" text-anchor="middle">2 jendela · cap (kini)</text>

  <path d="M262 226h26" stroke="#52525b" stroke-width="1.4"/>
  <path d="M284 221l6 5-6 5" fill="none" stroke="#52525b" stroke-width="1.4" stroke-linecap="round"/>

  <rect x="308" y="190" width="120" height="71" rx="9" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="308" y="214" width="120" height="47" fill="url(#wall)"/>
  <rect x="308" y="213" width="120" height="1" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="308" y="190" width="120" height="24" rx="9" fill="#0f172a"/>
  <rect x="308" y="203" width="120" height="11" fill="#0f172a"/>
  <text x="368" y="283" fill="#6ee7b7" font-size="9.5" text-anchor="middle">1 jendela · SetParent</text>

  <!-- left card: cost -->
  <rect x="72" y="340" width="384" height="220" rx="16" fill="#0b1220" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="92" y="370" fill="#e4e4e7" font-size="13.5" font-weight="600">Biaya &amp; cakupan</text>
  <g fill="#a1a1aa" font-size="11">
    <circle cx="98" cy="398" r="2.5" fill="#22d3ee"/>
    <text x="110" y="402">Ini perubahan layer host, bukan UI.</text>
    <circle cx="98" cy="426" r="2.5" fill="#22d3ee"/>
    <text x="110" y="430">mirror.rs → host.rs; tracker jadi resizer child.</text>
    <circle cx="98" cy="454" r="2.5" fill="#22d3ee"/>
    <text x="110" y="458">Butuh spike terpisah + uji di perangkat nyata.</text>
    <circle cx="98" cy="482" r="2.5" fill="#71717a"/>
    <text x="110" y="486">Tidak menyentuh ADB, DPAPI, atau fitur.</text>
    <circle cx="98" cy="510" r="2.5" fill="#71717a"/>
    <text x="110" y="514">Bisa gagal → tetap pakai model cap yang ada.</text>
  </g>
  <text x="92" y="542" fill="#71717a" font-size="10.5">Estimasi: satu modul baru + audit interaksi window.</text>

  <!-- left card: when -->
  <rect x="72" y="580" width="384" height="220" rx="16" fill="#0b1220" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="92" y="610" fill="#e4e4e7" font-size="13.5" font-weight="600">Kapan dipilih</text>
  <g fill="#a1a1aa" font-size="11">
    <circle cx="98" cy="638" r="2.5" fill="#34d399"/>
    <text x="110" y="642">Bila jahitan 1 px / 2 bayangan benar-benar mengganggu.</text>
    <circle cx="98" cy="666" r="2.5" fill="#34d399"/>
    <text x="110" y="670">Bila ingin satu taskbar &amp; satu radius jendela.</text>
    <circle cx="98" cy="694" r="2.5" fill="#f59e0b"/>
    <text x="110" y="698">Tidak menyelesaikan blur video (batas compositor).</text>
    <circle cx="98" cy="722" r="2.5" fill="#71717a"/>
    <text x="110" y="726">Tidak mengubah keamanan atau model input.</text>
  </g>
  <text x="92" y="770" fill="#71717a" font-size="10.5">Syarat: scrcpy tetap SDL; kita hanya mengubah parent-nya.</text>

  <!-- right card: how -->
  <rect x="960" y="300" width="408" height="170" rx="16" fill="#0b1220" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="980" y="330" fill="#e4e4e7" font-size="13.5" font-weight="600">Cara kerja</text>
  <g fill="#a1a1aa" font-size="11">
    <text x="980" y="362">• SetParent(mirror, parent) + gaya WS_CHILD.</text>
    <text x="980" y="388">• Panel dan video jadi anak dari satu parent.</text>
    <text x="980" y="414">• Satu frame, satu shadow, satu taskbar, satu radius.</text>
    <text x="980" y="440">• Geser dari area mana pun, termasuk video.</text>
    <text x="980" y="466">• Ukuran child dihitung dari rect parent.</text>
  </g>

  <!-- right card: risks -->
  <rect x="960" y="490" width="408" height="200" rx="16" fill="#0b1220" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="980" y="520" fill="#e4e4e7" font-size="13.5" font-weight="600">Risiko yang harus diuji</text>
  <g fill="#a1a1aa" font-size="11">
    <circle cx="986" cy="548" r="2.5" fill="#f59e0b"/>
    <text x="998" y="552">SDL/scrcpy mengatur ukuran &amp; fokusnya sendiri.</text>
    <circle cx="986" cy="576" r="2.5" fill="#f59e0b"/>
    <text x="998" y="580">Fullscreen &amp; DPI: koordinat parent↔child dipetakan.</text>
    <circle cx="986" cy="604" r="2.5" fill="#f59e0b"/>
    <text x="998" y="608">Input uhid/IME saat child di-reparent.</text>
    <circle cx="986" cy="632" r="2.5" fill="#71717a"/>
    <text x="998" y="636">Update scrcpy bisa mengubah perilaku window.</text>
    <circle cx="986" cy="660" r="2.5" fill="#71717a"/>
    <text x="998" y="664">Posisi taskbar saat mirror dipindah monitor.</text>
  </g>

  <!-- right card: visual result -->
  <rect x="960" y="710" width="408" height="90" rx="16" fill="#0b1220" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="980" y="740" fill="#e4e4e7" font-size="13.5" font-weight="600">Hasil visual</text>
  <text x="980" y="766" fill="#a1a1aa" font-size="11">Tidak ada garis rekat — panel terlihat menyatu.</text>
  <text x="980" y="786" fill="#71717a" font-size="10.5">Blur kaca tetap tidak bisa menembus permukaan video.</text>

  <text x="72" y="858" fill="#475569" font-size="10">Status: diterapkan (Fase 0-3 selesai) — model satu jendela aktif di src-tauri/src/host.rs. scrcpy SDL di-reparent ke jendela "main"; geometri dari kolom kiri; relay keyboard via subclass. Belum diuji ulang: DPI berbeda, pindah monitor, fallback standalone.</text>
</svg>
